[project]
name = "event-study"
version = "1.0.0"
description = "Event study framework measuring market reactions to geopolitical events."
authors = [{ name = "John Mitiguy" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "exchange-calendars>=4.13.2",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "tzdata>=2026.5",
    "yfinance>=1.7.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff.lint]
ignore = [
    "TRY004",  # Bad-input errors stay ValueError for consistency; data problems tied to one event raise EventDataError (a ValueError subclass), the only thing the runner catches.
]
