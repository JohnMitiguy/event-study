[project]
name = "event-study"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "exchange-calendars>=4.13.2",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "tzdata>=2026.5",
    "yfinance>=1.7.0",
]

[project.scripts]
event-study = "event_study:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff.lint]
ignore = [
    "TRY004",  # All bad-input errors in this project are ValueError on purpose, so callers catch a single type.
]
